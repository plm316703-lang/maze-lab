// ============================================================
// settings.gradle : 프로젝트 이름 + Gradle 자체 설정
// ★ 공용 파일
// ============================================================

plugins {
    // 자바 자동 배달부.
    // build.gradle 에 "자바 21" 이라고 했는데 컴퓨터에 21 이 없으면,
    // 이 플러그인이 21 을 알아서 다운로드해 온다. (처음 한 번만, 몇 분 걸림)
    // → 팀원마다 깔린 자바가 달라도 빌드는 다 같은 21 로 된다.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// 프로젝트 이름
rootProject.name = 'maze-lab'
