// ============================================================
// build.gradle : 프로젝트 "재료 목록". 무슨 도구 쓸지 적는 곳.
// IntelliJ 로 이 폴더 열면 알아서 재료(라이브러리) 가져온다.
// ★ 공용 파일 : 고칠 때 팀장한테 말한다
// ============================================================
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'          // 스프링부트 버전. 3.5.x 를 쓴다 (4.x 는 아직 쓰지 않는다)
    id 'io.spring.dependency-management' version '1.1.7'   // 라이브러리 버전 자동 맞춤
}

group = 'com.team'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // 자바 21 로 빌드한다. 팀 전원 같은 버전!
        // 컴퓨터에 21 이 없으면 settings.gradle 의 foojay 가 알아서 받아 온다.
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 한글 주석/문자열이 윈도우에서 깨지지 않게 "UTF-8 로 읽어라" 못 박기
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()                                         // 재료 가져오는 창고
}

dependencies {
    // 웹 요청 받는 도구 (Controller 등)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // 로그인/권한 지키는 문지기
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // DB 다루는 도구 (자바 객체 <-> 테이블)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // HTML 화면 만드는 도구
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // 입력값 검사 (@NotBlank 같은 것)
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // HTML 안에서 "로그인 했나?" 검사하는 도구 (sec:authorize)
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'


    // MySQL 연결 도구 : 서버 실행용 (공유 DB)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // H2 메모리 DB : ★ 테스트 전용. 지우지 마라!
    //   src/test/resources/application.yml 이 H2 를 쓴다.
    //   testRuntimeOnly = "테스트 돌릴 때만" 넣는다 → 서버 실행에는 안 들어간다
    testRuntimeOnly 'com.h2database:h2'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    //롬복 추가
    // Lombok : 본 코드 + 테스트 코드 둘 다
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
