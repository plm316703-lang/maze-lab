# ============================================================
# 테스트 전용 설정 (src/test 쪽)
# 테스트할 때는 main 의 application.yml 대신 이 파일이 쓰인다.
# → 테스트는 공유 DB 에 절대 안 붙는다. 메모리 DB(H2) 에서 놀고 끝나면 사라진다.
# ============================================================
spring:
    datasource:
        url: jdbc:h2:mem:testdb;MODE=MySQL   # MODE=MySQL : H2 가 MySQL 문법을 흉내 낸다
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: create-drop              # 테스트 시작에 테이블 만들고, 끝나면 지운다
        open-in-view: false
