# ============================================================
# gradle.properties : Gradle 자체가 돌 때 쓰는 설정
# ★ 공용 파일
# ============================================================

# Gradle 이 콘솔에 한글 찍을 때 깨지지 않게 (윈도우 테스트 결과 등)
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Xmx1g

# 빌드 결과 재사용 → 두 번째 빌드부터 빨라짐
org.gradle.caching=true
